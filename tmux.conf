# tmux.conf — scrollback-friendly defaults shipped with the `sessions` wrapper.
# Install to ~/.tmux.conf. Reload a running server with:  tmux source-file ~/.tmux.conf

# Mouse wheel enters copy-mode and scrolls through tmux's own history buffer.
# Shift+drag still selects text at the terminal level (ignoring tmux) if your
# terminal supports it.
set -g mouse on

# Keep a longer scrollback than tmux's default 2000 lines.
set -g history-limit 50000

# 256-color-aware default.
set -g default-terminal "tmux-256color"

# Status bar refresh (seconds).
set -g status-interval 5

# Alt+PageUp jumps straight into copy-mode scrolled up — skips the Prefix step.
bind -n M-PageUp copy-mode -u
